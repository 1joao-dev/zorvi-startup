name: ZORVI quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Tests
        run: bun run test -- --passWithNoTests
      - name: Production build
        run: bun run build

      - name: Validate catalog import scripts
        run: node --check scripts/sync-open-food-facts.mjs && node --check scripts/sync-anvisa-medicines.mjs
